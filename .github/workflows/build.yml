name: build-3dsx
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev || true
          dkp-pacman -S --noconfirm 3ds-dev || true
          apt-get update -qq || true
          apt-get install -y -qq ffmpeg || true
          which ffmpeg || echo "ffmpeg missing"
          which 3dsxtool || echo "3dsxtool missing"
          which picasso || echo "picasso missing"

      - name: Convert MP3 to WAV
        run: |
          cd romfs/music
          i=1
          for f in *.mp3; do
            echo "Converting $f -> track0$i.wav"
            ffmpeg -y -i "$f" -ac 1 -ar 22050 -c:a pcm_s16le "track0$i.wav"
            i=$((i+1))
          done
          ls -la *.wav

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: winterstad-3dsx
          path: winterstad.3dsx
