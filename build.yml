name: Build Winterstad 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Winterstad source
        run: unzip -q winterstad-source.zip -d winterstad

      - name: Build native 3DS game
        working-directory: winterstad
        run: make -j$(nproc --all)

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-3dsx
          path: winterstad/output/winterstad.3dsx

      - name: Upload complete build
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-build
          path: |
            winterstad/output/*
            winterstad/build/*.map
