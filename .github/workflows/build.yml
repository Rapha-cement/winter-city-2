name: Build Winterstad 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf winterstad
          mkdir winterstad
          unzip -q winterstad-source.zip -d winterstad
          test -f winterstad/Makefile
          test -f winterstad/native/source/main.c
          test -f winterstad/source/Winterstad_3D_original.html
          test -f winterstad/romfs/assets/music/track0.wav
          test -f winterstad/romfs/assets/music/track1.wav
          test -f winterstad/romfs/assets/music/track2.wav

      - name: Build
        working-directory: winterstad
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -j2

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-3dsx
          path: winterstad/output/winterstad.3dsx
