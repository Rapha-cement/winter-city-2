name: build-3dsx

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Download game ZIP
        run: |
          curl -L -o game.zip \
            https://github.com/Rapha-cement/winter-city-2/releases/download/v2.0/winterstad-nacht-3ds.zip

      - name: Extract game
        run: |
          unzip -o game.zip
          cd winterstad-3ds
          ls -la
          ls -la romfs/music

      - name: Install 3DS tools
        run: dkp-pacman -Sy --noconfirm 3ds-dev

      - name: Build
        run: |
          cd winterstad-3ds
          make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-3dsx
          path: winterstad-3ds/winterstad.3dsx
