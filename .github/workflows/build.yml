name: Build Winterstad 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS SDK
        shell: bash
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev
          test -f /opt/devkitpro/libctru/include/3ds.h
          test -f /opt/devkitpro/libctru/lib/libctru.a

      - name: Extract Winterstad source
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/winterstad"
          mkdir -p "$GITHUB_WORKSPACE/winterstad"
          unzip -q "$GITHUB_WORKSPACE/winterstad-source.zip" -d "$GITHUB_WORKSPACE/winterstad"
          test -f "$GITHUB_WORKSPACE/winterstad/Makefile"
          test -f "$GITHUB_WORKSPACE/winterstad/native/source/main.c"

      - name: Build Winterstad
        shell: bash
        working-directory: winterstad
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          CTRULIB: /opt/devkitpro/libctru
        run: |
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean || true
          make -j2

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-3dsx
          path: winterstad/output/winterstad.3dsx
