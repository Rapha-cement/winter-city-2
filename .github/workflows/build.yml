name: Build Winterstad 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Winterstad source
        run: |
          rm -rf "$GITHUB_WORKSPACE/winterstad"
          mkdir -p "$GITHUB_WORKSPACE/winterstad"
          unzip -q "$GITHUB_WORKSPACE/winterstad-source.zip" -d "$GITHUB_WORKSPACE/winterstad"
          echo "--- extracted files ---"
          ls -la "$GITHUB_WORKSPACE/winterstad"
          test -f "$GITHUB_WORKSPACE/winterstad/Makefile"

      - name: Build native 3DS game
        run: |
          cd "$GITHUB_WORKSPACE/winterstad"
          echo "--- Makefile ---"
          ls -la Makefile
          echo "--- DEVKITARM ---"
          echo "$DEVKITARM"
          make -f Makefile -j$(nproc --all)

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-3dsx
          path: winterstad/output/winterstad.3dsx

      - name: Upload complete build
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-build
          path: |
            winterstad/output/*
            winterstad/build/*.map
