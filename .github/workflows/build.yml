name: Build Winterstad 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev libctru

      - name: Extract Winterstad source
        run: |
          rm -rf "$GITHUB_WORKSPACE/winterstad"
          mkdir -p "$GITHUB_WORKSPACE/winterstad"
          unzip -q "$GITHUB_WORKSPACE/winterstad-source.zip" \
            -d "$GITHUB_WORKSPACE/winterstad"

      - name: Verify libctru
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          echo "Checking libctru..."
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          test -f "$DEVKITPRO/libctru/lib/libctru.a"
          echo "libctru OK"

      - name: Build native 3DS game
        working-directory: winterstad
        run: |
          make -j2

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-3dsx
          path: winterstad/output/winterstad.3dsx

      - name: Upload complete build
        uses: actions/upload-artifact@v4
        with:
          name: winterstad-build
          path: |
            winterstad/output/*
            winterstad/build/*.map
